#
# This is the Apache server configuration file providing SSL support.
# It contains the configuration directives to instruct the server how to
# serve pages over an https connection. For detailed information about these 
# directives see <URL:http://httpd.apache.org/docs/2.4/mod/mod_ssl.html>
# 
# Do NOT simply read the instructions in here without understanding
# what they do.  They're here only as hints or reminders.  If you are unsure
# consult the online docs. You have been warned.  
#
# Required modules: mod_log_config, mod_setenvif, mod_ssl,
#          socache_shmcb_module (for default value of SSLSessionCache)

#
# Pseudo Random Number Generator (PRNG):
# Configure one or more sources to seed the PRNG of the SSL library.
# The seed data should be of good random quality.
# WARNING! On some platforms /dev/random blocks if not enough entropy
# is available. This means you then cannot use the /dev/random device
# because it would lead to very long connection times (as long as
# it requires to make more entropy available). But usually those
# platforms additionally provide a /dev/urandom device which doesn't
# block. So, if available, use this one instead. Read the mod_ssl User
# Manual for more details.
#
#SSLRandomSeed startup file:/dev/random  512
#SSLRandomSeed startup file:/dev/urandom 512
#SSLRandomSeed connect file:/dev/random  512
#SSLRandomSeed connect file:/dev/urandom 512


#
# When we also provide SSL we have to listen to the 
# standard HTTP port (see above) and to the HTTPS port
#
Listen 8443

##
##  SSL Global Context
##
##  All SSL configuration in this context applies both to
##  the main server and all SSL-enabled virtual hosts.
##

#   SSL Cipher Suite:
#   List the ciphers that the client is permitted to negotiate,
#   and that httpd will negotiate as the client of a proxied server.
#   See the OpenSSL documentation for a complete list of ciphers, and
#   ensure these follow appropriate best practices for this deployment.
#   httpd 2.2.30, 2.4.13 and later force-disable aNULL, eNULL and EXP ciphers,
#   while OpenSSL disabled these by default in 0.9.8zf/1.0.0r/1.0.1m/1.0.2a.
SSLCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES
SSLProxyCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES

#  By the end of 2016, only TLSv1.2 ciphers should remain in use.
#  Older ciphers should be disallowed as soon as possible, while the
#  kRSA ciphers do not offer forward secrecy.  These changes inhibit
#  older clients (such as IE6 SP2 or IE8 on Windows XP, or other legacy
#  non-browser tooling) from successfully connecting.  
#
#  To restrict mod_ssl to use only TLSv1.2 ciphers, and disable
#  those protocols which do not support forward secrecy, replace
#  the SSLCipherSuite and SSLProxyCipherSuite directives above with
#  the following two directives, as soon as practical.
# SSLCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
# SSLProxyCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA

#   User agents such as web browsers are not configured for the user's
#   own preference of either security or performance, therefore this
#   must be the prerogative of the web server administrator who manages
#   cpu load versus confidentiality, so enforce the server's cipher order.
SSLHonorCipherOrder on 

#   SSL Protocol support:
#   List the protocol versions which clients are allowed to connect with.
#   Disable SSLv3 by default (cf. RFC 7525 3.1.1).  TLSv1 (1.0) should be
#   disabled as quickly as practical.  By the end of 2016, only the TLSv1.2
#   protocol or later should remain in use.
SSLProtocol all -SSLv3
SSLProxyProtocol all -SSLv3

#   Pass Phrase Dialog:
#   Configure the pass phrase gathering process.
#   The filtering dialog program (`builtin' is an internal
#   terminal dialog) has to provide the pass phrase on stdout.
SSLPassPhraseDialog  builtin

#   Inter-Process Session Cache:
#   Configure the SSL Session Cache: First the mechanism 
#   to use and second the expiring timeout (in seconds).
#SSLSessionCache "shmcb:D:/xampp/apache/logs/ssl_scache(512000)"
SSLSessionCache "shmcb:D:/xampp/apache/logs/ssl_scache(512000)"
SSLSessionCacheTimeout  300

#   OCSP Stapling (requires OpenSSL 0.9.8h or later)
#
#   This feature is disabled by default and requires at least
#   the two directives SSLUseStapling and SSLStaplingCache.
#   Refer to the documentation on OCSP Stapling in the SSL/TLS
#   How-To for more information.
#
#   Enable stapling for all SSL-enabled servers:
#SSLUseStapling On

#   Define a relatively small cache for OCSP Stapling using
#   the same mechanism that is used for the SSL session cache
#   above.  If stapling is used with more than a few certificates,
#   the size may need to be increased.  (AH01929 will be logged.)
#SSLStaplingCache "shmcb:${SRVROOT}/logs/ssl_stapling(32768)"

#   Seconds before valid OCSP responses are expired from the cache
#SSLStaplingStandardCacheTimeout 3600

#   Seconds before invalid OCSP responses are expired from the cache
#SSLStaplingErrorCacheTimeout 600

##
## SSL Virtual Host Context
##

<VirtualHost _default_:8443 *:8443>
    ServerName localhost
    ServerAlias * 127.0.0.1 supportflast.local supportflastdev.io.vn www.supportflastdev.io.vn 192.168.* 10.* 172.16.*
    ServerAdmin admin@example.com

    DocumentRoot "D:/xampp/htdocs"

    # SSL Engine Switch & Certificates
    SSLEngine on
    SSLCertificateFile "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "conf/ssl.key/server.key"

    # Mở quyền truy cập đầy đủ cho mọi máy khách (Client, LAN, WAN) như một web thật
    <Proxy *>
        Require all granted
    </Proxy>

    # Bật ProxyPreserveHost để chuyển nguyên vẹn Host header gốc tới Go Engine
    ProxyPreserveHost On
    ProxyRequests Off

    # Tối ưu hóa thời gian chờ (Timeout) cho tác vụ AI, streaming và upload file lớn
    Timeout 3600
    ProxyTimeout 3600

    # Cho phép upload file lớn lên tới 2GB (CloudPool Storage, Backup, WebDAV VFS)
    LimitRequestBody 2147483648

    # Forward các headers quan trọng cho Go Engine nhận diện Client IP & HTTPS Scheme
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "8443"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Security Headers tuân thủ nghiêm ngặt Antigravity Workspace Rules (Rule 3.4 & 3.5)
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https:;"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header unset Server
        Header unset X-Powered-By
        Header unset X-AspNet-Version
        Header always unset Server
        Header always unset X-Powered-By
        Header always unset X-AspNet-Version
    </IfModule>

    # Chặn truy cập trực tiếp vào các tệp/thư mục nhạy cảm (Rule 3.2, 3.5)
    <LocationMatch "(/\.env|/\.git|/data/keys|/\.bak|\.db$|\.sqlite$|\.sqlite3$|\.pem$|\.key$|\.sql$|\.log$)">
        Require all denied
    </LocationMatch>

    # Cơ chế Rewrite tự động nâng cấp kết nối WebSocket & chặn tệp nhạy cảm
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Chặn truy cập tệp nhạy cảm ngay từ rewrite engine
        RewriteRule (^|/)\.env - [F,L,NC]
        RewriteRule (^|/)\.git - [F,L,NC]
        RewriteRule (^|/)data/keys - [F,L,NC]
        RewriteRule \.(db|sqlite|sqlite3|pem|key|sql|log|bak)$ - [F,L,NC]

        # Nâng cấp kết nối WebSocket (101 Switching Protocols)
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/?(.*) ws://127.0.0.1:8080/$1 [P,L]
    </IfModule>

    # WebSocket Reverse Proxy tường minh cho Realtime AI Assistant & Live Sync
    ProxyPass /ws/ ws://127.0.0.1:8080/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8080/ws/
    ProxyPass /ws ws://127.0.0.1:8080/ws
    ProxyPassReverse /ws ws://127.0.0.1:8080/ws

    # WebDAV RFC-4918 Reverse Proxy (Mount Virtual Network Drive - CloudPool VFS)
    ProxyPass /webdav/ http://127.0.0.1:8080/webdav/
    ProxyPassReverse /webdav/ http://127.0.0.1:8080/webdav/
    ProxyPass /webdav http://127.0.0.1:8080/webdav
    ProxyPassReverse /webdav http://127.0.0.1:8080/webdav

    # Sub-path proxy (Hỗ trợ truy cập cả qua https://localhost:8443/supportflast/)
    <Location /supportflast/>
        ProxyPass http://127.0.0.1:8080/
        ProxyPassReverse http://127.0.0.1:8080/
        RequestHeader set X-Forwarded-Prefix "/supportflast"
    </Location>

    # Thư mục DocumentRoot phục vụ các trang PHP cục bộ của XAMPP
    <Directory "D:/xampp/htdocs">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # --------------------------------------------------------------------------
    # NGOẠI TRỪ CÁC TRANG QUẢN TRỊ PHP & TÀI NGUYÊN GỐC XAMPP (KHÔNG PROXY SANG GO)
    # --------------------------------------------------------------------------
    ProxyPass /phpmanager !
    ProxyPass /phpmyadmin !
    ProxyPass /phpMyAdmin !
    ProxyPass /phpadmin !
    ProxyPass /dashboard !
    ProxyPass /phpinfo.php !
    ProxyPass /xampp !
    ProxyPass /webalizer !
    ProxyPass /licenses !
    ProxyPass /php-cgi !

    # Web UI Hub 3D, API Gateway & Diagnostics (Chuyển tiếp tất cả request còn lại)
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Standard SSL directives
    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>
    <Directory "D:/xampp/apache/cgi-bin">
        SSLOptions +StdEnvVars
    </Directory>

    BrowserMatch "MSIE [2-5]" \
             nokeepalive ssl-unclean-shutdown \
             downgrade-1.0 force-response-1.0

    # Nhật ký truy cập và lỗi riêng biệt cho HTTPS SupportFlast
    ErrorLog "D:/xampp/apache/logs/supportflast_ssl_error.log"
    CustomLog "D:/xampp/apache/logs/supportflast_ssl_access.log" combined
    CustomLog "D:/xampp/apache/logs/ssl_request.log" \
              "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
</VirtualHost>                                  
