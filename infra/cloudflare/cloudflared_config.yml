# ==============================================================================
# Cloudflare Tunnel Configuration Template
# ==============================================================================
# Tệp mẫu cấu hình Cloudflare Tunnel cho nhà phát triển tự host.
# Hướng dẫn thiết lập:
#   1. Đăng nhập Cloudflare: cloudflared tunnel login
#   2. Tạo tunnel: cloudflared tunnel create <ten-tunnel-cua-ban>
#   3. Trỏ DNS: cloudflared tunnel route dns <ten-tunnel> <ten-mien-cua-ban>
#   4. Khởi chạy: cloudflared tunnel run <ten-tunnel>
# ==============================================================================

# Thay thế bằng Tunnel UUID và tệp xác thực JSON của riêng bạn (được tạo ở bước 2)
tunnel: YOUR_TUNNEL_UUID_HERE
credentials-file: ~/.cloudflared/YOUR_TUNNEL_UUID_HERE.json

ingress:
  # 1. Định tuyến domain chính về cổng 8080 của SupportFlast Go Engine
  - hostname: supportflastdev.io.vn
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 60s

  # 2. Định tuyến subdomain www về cổng 8080
  - hostname: www.supportflastdev.io.vn
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 60s

  # 3. Định tuyến subdomain api về cổng 8080
  - hostname: api.supportflastdev.io.vn
    service: http://127.0.0.1:8080

  # 4. Quy tắc Fallback bắt buộc của Cloudflare Tunnel
  - service: http_status:404
