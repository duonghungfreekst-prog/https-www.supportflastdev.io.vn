# ==============================================================================
# SUPPORTFLAST MONOLITH REVERSE PROXY - CẤU HÌNH NGINX SẢN XUẤT TỐI ƯU
# ==============================================================================
# Domain Mặc Định   : supportflastdev.io.vn (www.supportflastdev.io.vn)
# Kiến Trúc         : SupportFlast Go Monolith Cổng 8080 Duy Nhất
# Khả Năng          : Web 3D HUD + Storage + WebDAV VFS + Dev Tools + REST API Gateway
# Phiên Bản Nginx   : Nginx 1.18+ / 1.24+ trên Linux VPS (Ubuntu / Debian / Rocky / Alma)
# ==============================================================================
# 
# ------------------------------------------------------------------------------
# MỤC LỤC HƯỚNG DẪN CHI TIẾT (NGINX CONFIGURATION & OPERATIONS GUIDE):
# ------------------------------------------------------------------------------
# 1. HƯỚNG DẪN TRIỂN KHAI VÀ LIÊN KẾT VIRTUALHOST:
#    - Sao chép file này vào thư mục: /etc/nginx/sites-available/supportflastdev.io.vn.conf
#    - Tạo symlink kích hoạt:
#        sudo ln -sf /etc/nginx/sites-available/supportflastdev.io.vn.conf /etc/nginx/sites-enabled/
#    - Xóa vhost mặc định nếu có để tránh xung đột cổng 80:
#        sudo rm -f /etc/nginx/sites-enabled/default
#    - Kiểm tra cú pháp Nginx:
#        sudo nginx -t
#    - Nạp lại cấu hình:
#        sudo systemctl reload nginx
#
# 2. HƯỚNG DẪN CẤP CHỨNG CHỈ SSL VÀ CẤU HÌNH TỰ ĐỘNG GIA HẠN (LET'S ENCRYPT):
#    - Cài đặt Certbot và plugin Nginx:
#        Ubuntu/Debian: sudo apt update && sudo apt install -y certbot python3-certbot-nginx
#        Rocky/CentOS : sudo dnf install -y epel-release && sudo dnf install -y certbot python3-certbot-nginx
#    - Chạy lệnh tự động cấp SSL & cấu hình HTTPS:
#        sudo certbot --nginx -d supportflastdev.io.vn -d www.supportflastdev.io.vn --redirect
#    - Kiểm tra tính năng tự động gia hạn (Dry Run):
#        sudo certbot renew --dry-run
#    - Kích hoạt systemd timer tự gia hạn:
#        sudo systemctl enable --now certbot.timer
#
# 3. HƯỚNG DẪN KẾT NỐI KHO FILE WEBDAV TỪ CÁC THIẾT BỊ:
#    - Windows Map Network Drive (gán ổ đĩa Z:):
#        net use Z: https://supportflastdev.io.vn/webdav /user:admin [PASSWORD] /persistent:yes
#    - macOS Finder:
#        Nhấn Command + K -> Nhập: https://supportflastdev.io.vn/webdav -> Nhập user/pass
#    - Ứng dụng WinSCP / Cyberduck / Rclone:
#        Chọn giao thức WebDAV (HTTPS Port 443) -> Host: supportflastdev.io.vn -> Path: /webdav
#
# 4. CHỈ DẪN VỀ BUFFER VÀ TẢI FILE LỚN 1000M:
#    - 'client_max_body_size 1000M': Cho phép tải lên các gói cài đặt, video, file nén đến 1000MB.
#    - 'client_body_buffer_size 16M': Đệm RAM tiếp nhận payload nhanh chóng, giảm I/O disk.
#    - 'proxy_request_buffering off' & 'proxy_buffering off' tại /webdav và /storage:
#      Bắt buộc tắt đệm proxy để truyền dữ liệu stream nhị phân trực tiếp (Zero-Copy Streaming)
#      về Go Engine VFS, giúp RAM không bị tăng đột biến và tránh lỗi 504 Gateway Timeout.
#
# 5. CHỈ DẪN VỀ WEBSOCKET (/ws):
#    - 'proxy_http_version 1.1' kết hợp '$http_upgrade' & '$connection_upgrade':
#      Đảm bảo bắt tay chuyển đổi giao thức (Protocol Switch 101 Switching Protocols).
#    - 'proxy_read_timeout 3600s' & 'proxy_send_timeout 3600s':
#      Giữ kết nối hai chiều ổn định trong 1 giờ, tránh bị rớt kết nối heartbeat / ping-pong.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UPSTREAM BACKEND (SupportFlast Monolith Service - Cổng 8080 Duy Nhất)
# ------------------------------------------------------------------------------
upstream supportflast_app {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 2. WEBSOCKET CONNECTION UPGRADE MAP
# ------------------------------------------------------------------------------
# Xác định giá trị header Connection tương ứng khi client yêu cầu nâng cấp WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# 2.5. STRICT CORS ORIGIN MAP (Rule 3.4 Antigravity - Exact String Match)
# TUYỆT ĐỐI KHÔNG DÙNG WILDCARD '*' HOẶC REGEX PATTERN MATCHING ĐỂ BẢO VỆ DỮ LIỆU
# ------------------------------------------------------------------------------
map $http_origin $cors_origin {
    default "";
    "http://localhost:8080"             "http://localhost:8080";
    "http://127.0.0.1:8080"             "http://127.0.0.1:8080";
    "https://supportflastdev.io.vn"     "https://supportflastdev.io.vn";
    "https://www.supportflastdev.io.vn" "https://www.supportflastdev.io.vn";
}

# ------------------------------------------------------------------------------
# 3. RATE LIMITING & CONNECTION LIMITING (Chống DDoS Layer 7 & Brute-Force)
# ------------------------------------------------------------------------------
# Giới hạn 120 yêu cầu / phút (2 req/s) trên mỗi địa chỉ IP thực tế của client
limit_req_zone $binary_remote_addr zone=rate_limit_120rpm:10m rate=120r/m;

# Giới hạn riêng cho API đăng nhập/xác thực chống brute-force (10 req/phút)
limit_req_zone $binary_remote_addr zone=auth_limit_zone:10m rate=10r/m;

# Giới hạn tối đa 50 kết nối đồng thời từ 1 địa chỉ IP
limit_conn_zone $binary_remote_addr zone=conn_limit_zone:10m;

# Định dạng mã lỗi trả về khi vượt ngưỡng rate limit (429 Too Many Requests)
limit_req_status 429;
limit_conn_status 429;

# ------------------------------------------------------------------------------
# 4. CHUYỂN HƯỚNG HTTP (Port 80) SANG HTTPS (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name supportflastdev.io.vn www.supportflastdev.io.vn;

    # Xác thực Certbot Let's Encrypt qua Webroot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Chuyển hướng bắt buộc sang HTTPS vĩnh viễn (301 Moved Permanently)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 5. MÁY CHỦ HTTPS CHÍNH (Port 443) - MONOLITH REVERSE PROXY
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supportflastdev.io.vn www.supportflastdev.io.vn;

    # --------------------------------------------------------------------------
    # A. CHỨNG CHỈ SSL/TLS & TỐI ƯU MÃ HÓA (TLS 1.2 & TLS 1.3 - Chuẩn A+ SSLLabs)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/supportflastdev.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supportflastdev.io.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling giúp tăng tốc độ bắt tay SSL và giảm tải CA
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # B. THU THẬP IP THỰC TỪ CLOUDFLARE (Real IP Restoration)
    # --------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --------------------------------------------------------------------------
    # C. BẢO MẬT HEADERS QUÂN SỰ (Tuân thủ Rule 3.4 & 3.5 Antigravity Workspace)
    # --------------------------------------------------------------------------
    # Chống MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Chống Clickjacking (khóa hoàn toàn việc nhúng iframe ngoại lai)
    add_header X-Frame-Options "DENY" always;

    # Bắt buộc kết nối HTTPS (HSTS 1 năm, bao gồm subdomains và danh sách preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (CSP) phòng chống XSS triệt để
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

    # XSS Protection tương thích trình duyệt kế thừa
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy kiểm soát thông tin nguồn gửi đi
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy vô hiệu hóa các API phần cứng không dùng
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Ẩn toàn bộ thông tin phiên bản máy chủ nhằm chống do thám (Rule 3.4 & 3.5)
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-AspNet-Version;

    # --------------------------------------------------------------------------
    # D. TỐI ƯU HÓA BỘ ĐỆM (BUFFER TUNING) VÀ TẢI LÊN LỚN (1000M)
    # --------------------------------------------------------------------------
    # Dung lượng tải lên tối đa 1000MB (1GB) đáp ứng file cài đặt, ISO, media
    client_max_body_size 1000M;

    # Bộ đệm đọc request body trên RAM (16MB), vượt quá sẽ ghi tạm ra disk
    client_body_buffer_size 16M;

    # Bộ đệm xử lý HTTP Header lớn (Cookies, Auth Token JWT dài)
    large_client_header_buffers 4 32k;

    # Bộ đệm nhận phản hồi từ Backend Go Monolith
    proxy_buffer_size 128k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;

    # --------------------------------------------------------------------------
    # E. TỐI ƯU NÉN DỮ LIỆU: GZIP COMPRESSION
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/atom+xml
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # --------------------------------------------------------------------------
    # F. ÁP DỤNG RATE LIMITING & CONNECTION LIMITING TOÀN CỤC CHO SERVER
    # --------------------------------------------------------------------------
    limit_req zone=rate_limit_120rpm burst=30 nodelay;
    limit_conn conn_limit_zone 50;

    # --------------------------------------------------------------------------
    # G. CACHE CONTROL TỐI ƯU CHO STATIC ASSETS (CSS, JS, ẢNH, FONT, 3D GLTF)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|svgz|webp|avif|woff|woff2|ttf|eot|otf|gltf|bin)$ {
        proxy_pass http://supportflast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache tĩnh 365 ngày trên Trình duyệt & CDN Cloudflare
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # H. WEBSOCKET PROXY (/ws) - HỖ TRỢ REAL-TIME 2 CHIỀU ĐỒNG BỘ SỰ KIỆN SUBAGENTS
    # --------------------------------------------------------------------------
    # Cơ chế: HTTP Upgrade 101 Switching Protocols chuyển kênh TCP socket hai chiều
    # Kết nối trực tiếp vào Hub WebSocket của Go Monolith Engine (Cổng 8080)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://supportflast_app;
        proxy_http_version 1.1;

        # Chuyển tiếp các Header nâng cấp WebSocket bắt buộc
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout 1 giờ (3600 giây) giữ phiên socket mở liên tục mà không bị đứt
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Tắt đệm để dữ liệu tin nhắn gửi và nhận tức thời không trễ
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # I. GIAO THỨC WEBDAV (/webdav, /webdav/) - KHO FILE ẢO ĐA THIẾT BỊ (VFS)
    # --------------------------------------------------------------------------
    # Hỗ trợ đầy đủ các phương thức HTTP mở rộng của chuẩn RFC 4918 WebDAV:
    # PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, LOCK, UNLOCK, PUT, DELETE, GET, HEAD, OPTIONS
    # Tương thích 100%: Windows Map Network Drive, macOS Finder, WinSCP, Cyberduck, Rclone
    # --------------------------------------------------------------------------
    location ^~ /webdav {
        proxy_pass http://supportflast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Các Header đặc thù tối quan trọng cho giao thức WebDAV
        proxy_set_header Destination $http_destination;
        proxy_set_header Depth $http_depth;
        proxy_set_header Overwrite $http_overwrite;
        proxy_set_header If $http_if;
        proxy_set_header Lock-Token $http_lock_token;
        proxy_set_header Timeout $http_timeout;

        # Cho phép tải lên file dung lượng lên tới 1000MB (1GB)
        client_max_body_size 1000M;
        client_body_buffer_size 16M;

        # VÔ HIỆU HÓA BUFFERING: Stream trực tiếp nhị phân về Go Engine VFS
        # Ngăn chặn cạn kiệt RAM và loại bỏ hoàn toàn độ trễ ghi đệm ra đĩa
        proxy_request_buffering off;
        proxy_buffering off;

        # Thời gian chờ truyền nhận file lớn
        proxy_connect_timeout 120s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Tắt mã hóa gzip trung gian để giữ nguyên vẹn chunk dữ liệu WebDAV
        proxy_set_header Accept-Encoding "";

        # Tuyệt đối không cache phản hồi của WebDAV
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --------------------------------------------------------------------------
    # J. KHO LƯU TRỮ ĐÁM MÂY (/storage) - TỐI ƯU CHO STREAMING FILE LỚN & CHUNK VFS
    # --------------------------------------------------------------------------
    location ^~ /storage {
        proxy_pass http://supportflast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dung lượng tải lên 1000MB (1GB)
        client_max_body_size 1000M;
        client_body_buffer_size 16M;

        # Zero-copy streaming không đệm trung gian
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # K. CỔNG CÔNG CỤ PHÁT TRIỂN & XUẤT BẢN (/tools)
    # --------------------------------------------------------------------------
    location /tools {
        proxy_pass http://supportflast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --------------------------------------------------------------------------
    # L. API RATE LIMITING ĐĂNG NHẬP (Chống Brute-Force Password)
    # --------------------------------------------------------------------------
    location /api/auth/login {
        # Giới hạn 10 req/phút, burst=5 chống tấn công vét cạn mật khẩu
        limit_req zone=auth_limit_zone burst=5 nodelay;

        proxy_pass http://supportflast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tuyệt đối không cache dữ liệu xác thực
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --------------------------------------------------------------------------
    # M. API ENDPOINTS - TUYỆT ĐỐI NO-CACHE & PROXY SANG MONOLITH CỔNG 8080
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://supportflast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chặn cache API triệt để
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # N. ROUTE MẶC ĐỊNH & SINGLE PAGE APPLICATION (SPA / Web 3D HUD UI)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://supportflast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Trang chính index.html không được lưu cache để phản hồi tức thì cập nhật mới
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
