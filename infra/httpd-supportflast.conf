# ==============================================================================
# SupportFlast Go Monolith - Cấu hình Apache Reverse Proxy cho XAMPP
# Kiến trúc: Go Monolith Engine (Port 8080) sau XAMPP Apache (Port 80 / 443)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. KÍCH HOẠT CÁC MODULE APACHE BẮT BUỘC (NẾU CHƯA ĐƯỢC LOAD TOÀN CỤC)
# ------------------------------------------------------------------------------
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>

<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

<IfModule !proxy_wstunnel_module>
    LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>

<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>

<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>

# ------------------------------------------------------------------------------
# 2. VIRTUALHOST CHÍNH CHO SUPPORTFLAST (PORT 80)
# Truy cập qua: http://localhost, http://supportflast.local, http://supportflastdev.io.vn
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName localhost
    ServerAlias * 127.0.0.1 supportflast.local supportflastdev.io.vn www.supportflastdev.io.vn 192.168.* 10.* 172.16.*

    # Mở quyền truy cập đầy đủ cho mọi máy khách (Client, LAN, WAN) như một web thật
    <Proxy *>
        Require all granted
    </Proxy>

    # Bật ProxyPreserveHost để chuyển nguyên vẹn Host header gốc tới Go Engine
    ProxyPreserveHost On
    ProxyRequests Off

    # Tối ưu hóa thời gian chờ (Timeout) cho tác vụ AI, streaming và upload file lớn
    Timeout 3600
    ProxyTimeout 3600

    # Cho phép upload file lớn lên tới 2GB (CloudPool Storage, Backup, WebDAV VFS)
    LimitRequestBody 2147483648

    # Forward các headers quan trọng cho Go Engine nhận diện Client IP & Scheme
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Security Headers tuân thủ nghiêm ngặt Antigravity Workspace Rules (Rule 3.4 & 3.5)
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https:;"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header unset Server
        Header unset X-Powered-By
        Header unset X-AspNet-Version
        Header always unset Server
        Header always unset X-Powered-By
        Header always unset X-AspNet-Version
    </IfModule>

    # Chặn truy cập trực tiếp vào các tệp/thư mục nhạy cảm (Rule 3.2, 3.5)
    <LocationMatch "(/\.env|/\.git|/data/keys|/\.bak|\.db$|\.sqlite$|\.sqlite3$|\.pem$|\.key$|\.sql$|\.log$)">
        Require all denied
    </LocationMatch>

    # Cơ chế Rewrite tự động nâng cấp kết nối WebSocket & chặn tệp nhạy cảm
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Chặn truy cập tệp nhạy cảm ngay từ rewrite engine
        RewriteRule (^|/)\.env - [F,L,NC]
        RewriteRule (^|/)\.git - [F,L,NC]
        RewriteRule (^|/)data/keys - [F,L,NC]
        RewriteRule \.(db|sqlite|sqlite3|pem|key|sql|log|bak)$ - [F,L,NC]

        # Chặn các hệ thống bot tự động, crawler rác và scanner xấu (Anti-Bot & Anti-Scanner)
        RewriteCond %{HTTP_USER_AGENT} (sqlmap|nikto|acunetix|dirbuster|gobuster|nmap|masscan|wpscan|censys|shodan|zgrab|bytespider|semrushbot|ahrefsbot|mj12bot|dotbot) [NC]
        RewriteCond %{REMOTE_ADDR} !^127\.0\.0\.1$
        RewriteCond %{REMOTE_ADDR} !^::1$
        RewriteRule ^ - [F,L]

        # Nâng cấp kết nối WebSocket (101 Switching Protocols)
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/?(.*) ws://127.0.0.1:8080/$1 [P,L]
    </IfModule>

    # WebSocket Reverse Proxy tường minh cho Realtime AI Assistant & Live Sync
    ProxyPass /ws/ ws://127.0.0.1:8080/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8080/ws/
    ProxyPass /ws ws://127.0.0.1:8080/ws
    ProxyPassReverse /ws ws://127.0.0.1:8080/ws

    # WebDAV RFC-4918 Reverse Proxy (Mount Virtual Network Drive - CloudPool VFS)
    # Hỗ trợ đầy đủ PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, LOCK, UNLOCK, PUT, DELETE
    ProxyPass /webdav/ http://127.0.0.1:8080/webdav/
    ProxyPassReverse /webdav/ http://127.0.0.1:8080/webdav/
    ProxyPass /webdav http://127.0.0.1:8080/webdav
    ProxyPassReverse /webdav http://127.0.0.1:8080/webdav

    # Sub-path proxy (Hỗ trợ truy cập cả qua http://localhost/supportflast/)
    <Location /supportflast/>
        ProxyPass http://127.0.0.1:8080/
        ProxyPassReverse http://127.0.0.1:8080/
        RequestHeader set X-Forwarded-Prefix "/supportflast"
    </Location>

    # Thư mục DocumentRoot phục vụ các trang PHP cục bộ của XAMPP
    DocumentRoot "D:/xampp/htdocs"
    <Directory "D:/xampp/htdocs">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # --------------------------------------------------------------------------
    # NGOẠI TRỪ CÁC TRANG QUẢN TRỊ PHP & TÀI NGUYÊN GỐC XAMPP (KHÔNG PROXY SANG GO)
    # --------------------------------------------------------------------------
    ProxyPass /phpmanager !
    ProxyPass /phpmyadmin !
    ProxyPass /phpMyAdmin !
    ProxyPass /phpadmin !
    ProxyPass /dashboard !
    ProxyPass /phpinfo.php !
    ProxyPass /xampp !
    ProxyPass /webalizer !
    ProxyPass /licenses !
    ProxyPass /php-cgi !
    ProxyPass /robots.txt !
    ProxyPass /favicon.ico !

    # Web UI Hub 3D, API Gateway & Diagnostics (Chuyển tiếp tất cả request còn lại)
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Nhật ký truy cập và lỗi riêng biệt cho SupportFlast
    ErrorLog "logs/supportflast_error.log"
    CustomLog "logs/supportflast_access.log" combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 3. CẤU HÌNH HTTPS CHO SUPPORTFLAST (CỔNG AN TOÀN 8443)
# ------------------------------------------------------------------------------
# Nhằm tránh triệt để lỗi xung đột cổng 443 trên Windows (Skype, Node, VMware,...),
# SupportFlast cấu hình HTTPS mặc định sử dụng cổng an toàn 8443 tại:
# 'conf/extra/httpd-ssl.conf' của XAMPP.
# Cấu hình SSL VirtualHost *:8443 trong httpd-ssl.conf đã được đồng bộ toàn diện:
# Reverse Proxy tới Go Engine (Port 8080), WebSocket, WebDAV VFS, Security Headers
# và loại trừ các trang quản trị PHP cục bộ (/phpmyadmin, /phpmanager, /dashboard).

