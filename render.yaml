# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Hỗ trợ triển khai 1-Click đồng bộ Go Monolith Engine và Python AI trên Render Cloud
# Domain: supportflastdev.io.vn | Tương thích chuẩn Render Blueprint Specification
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Python Multi-Agent AI Service (5 Subagents Điều Phối Hỗ Trợ & An Ninh)
  # ----------------------------------------------------------------------------
  - type: web
    name: supportflast-ai
    env: docker
    dockerfilePath: ./supportflast_ai/Dockerfile
    dockerContext: ./supportflast_ai
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: 1
      - key: ENV
        value: production
      - key: INTERNAL_SERVICE_SECRET
        value: sf_internal_service_prod_secret_2026_a8f9c1d2e3b4

  # ----------------------------------------------------------------------------
  # 2. Go Monolith Engine (Web 3D UI, Hub API Gateway, Virtual Storage, SIEM)
  # ----------------------------------------------------------------------------
  - type: web
    name: supportflast-engine
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    region: singapore
    # Healthcheck HTTP kiểm tra định kỳ sức khỏe engine
    healthCheckPath: /api/health
    envVars:
      # Render tự động gán biến PORT động và định tuyến lưu lượng vào cổng này
      - key: PORT
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: ENV
        value: production
      - key: INTERNAL_SERVICE_SECRET
        value: sf_internal_service_prod_secret_2026_a8f9c1d2e3b4
      - key: DOMAIN
        value: supportflastdev.io.vn
      - key: ALLOWED_ORIGINS
        value: https://supportflastdev.io.vn,https://www.supportflastdev.io.vn,https://supportflastdev-io-vn.onrender.com
      # Cấu hình lưu trữ dữ liệu bền vững trên Persistent Disk
      - key: DATA_DIR
        value: /app/data
      # Lưu trữ packages trong /app/data/storage để cùng nằm trên Persistent Disk đã mount
      - key: STORAGE_DIR
        value: /app/data/storage
      - key: UI_DIR
        value: /app/supportflast_ui
      - key: STATIC_DIR
        value: /app/supportflast_ui
      - key: JWT_KEYS_DIR
        value: /app/data/keys
      # Cấu hình Cơ sở dữ liệu Aiven PostgreSQL Cloud Cluster
      - key: DB_DRIVER
        value: postgres
      - key: CLOUDPOOL_DB_DRIVER
        value: postgres
      - key: AIVEN_PG_URI
        value: postgres://avnadmin:AVNS_u3Qmxf4ne10H3N2fQ21@pg-333a3094-duonghungfreekst-ee66.d.aivencloud.com:17204/defaultdb?sslmode=require
      - key: DATABASE_URL
        value: postgres://avnadmin:AVNS_u3Qmxf4ne10H3N2fQ21@pg-333a3094-duonghungfreekst-ee66.d.aivencloud.com:17204/defaultdb?sslmode=require
      - key: PG_MAX_OPEN_CONNS
        value: "8"
      - key: PG_MAX_IDLE_CONNS
        value: "3"
      - key: PG_CONN_MAX_LIFETIME
        value: "3m"
      - key: PG_CONN_MAX_IDLE_TIME
        value: "30s"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URL
        value: https://supportflastdev.io.vn/api/accounts/oauth/callback
      - key: CLOUDPOOL_MASTER_KEY
        sync: false
      # Giới hạn bộ nhớ Go Monolith chống OOM trên Render Free Tier (512MB RAM - Rule 7.1)
      - key: GOMEMLIMIT
        value: 384MiB
      - key: GOGC
        value: "80"
      # Kết nối nội bộ tới Python AI Service
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: supportflast-ai
          property: host

