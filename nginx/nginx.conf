# ==============================================================================
# Nginx Reverse Proxy Configuration cho SupportFlast Production Stack (Docker)
# Domain: supportflastdev.io.vn (www.supportflastdev.io.vn)
# Upstream: supportflast-app:8080 (Docker Internal Network)
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng log chuẩn JSON/Extended
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Tối ưu hóa I/O Kernel
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # --------------------------------------------------------------------------
    # 1. UPSTREAM BACKEND (Dịch vụ SupportFlast Monolith qua Docker Network)
    # --------------------------------------------------------------------------
    upstream supportflast_app {
        server supportflast-app:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # 2. WEBSOCKET CONNECTION UPGRADE MAP
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------------------------------
    # 3. RATE LIMITING & CONNECTION LIMITING (Chống DDoS & Brute-Force)
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=rate_limit_120rpm:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit_zone:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit_zone:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # 4. SERVER HTTP (Port 80) - ACME Challenge & Redirect HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name supportflastdev.io.vn www.supportflastdev.io.vn localhost;

        # Xác thực Certbot Let's Encrypt qua Webroot ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Chuyển hướng bắt buộc sang HTTPS cho domain chính thức
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 5. SERVER HTTPS CHÍNH (Port 443) - MONOLITH REVERSE PROXY
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name supportflastdev.io.vn www.supportflastdev.io.vn;

        # A. Chứng chỉ SSL/TLS Let's Encrypt Certbot
        ssl_certificate /etc/letsencrypt/live/supportflastdev.io.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/supportflastdev.io.vn/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # B. Phục hồi IP thực từ Cloudflare / Proxy
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header CF-Connecting-IP;

        # C. Security Headers (Tuân thủ Rule 3.4 Antigravity)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        server_tokens off;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header X-AspNet-Version;

        # D. Nén GZIP
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_types
            text/plain text/css text/xml text/javascript
            application/javascript application/x-javascript application/json
            application/xml application/xml+rss image/svg+xml font/woff font/woff2;

        # E. Rate limit & Connection limit
        limit_req zone=rate_limit_120rpm burst=30 nodelay;
        limit_conn conn_limit_zone 25;

        client_max_body_size 500M;
        client_body_buffer_size 128k;

        # F. Cache Static Assets
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|svgz|webp|avif|woff|woff2|ttf|eot|otf|gltf|bin)$ {
            proxy_pass http://supportflast_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # G. WebSocket (/ws)
        location /ws {
            proxy_pass http://supportflast_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # H. Storage & WebDAV (/storage & /webdav)
        location /storage {
            proxy_pass http://supportflast_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 500M;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /webdav {
            proxy_pass http://supportflast_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 500M;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # I. Tools (/tools)
        location /tools {
            proxy_pass http://supportflast_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # J. Auth Login Rate Limiting
        location /api/auth/login {
            limit_req zone=auth_limit_zone burst=5 nodelay;

            proxy_pass http://supportflast_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # K. API Endpoints
        location /api/ {
            proxy_pass http://supportflast_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # L. SPA / Web 3D HUD UI
        location / {
            proxy_pass http://supportflast_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
