# ==============================================================================
# Nginx Reverse Proxy Configuration cho domain: supportflastdev.io.vn
# ==============================================================================
# Hỗ trợ: SupportFlast Monolith Cổng 8080 Duy Nhất
# Tính năng: Web 3D HUD + Storage + WebDAV VFS + Dev Tools + REST API Gateway + WebSocket
# Đường dẫn cài đặt: /etc/nginx/sites-available/supportflastdev.io.vn.conf
# ==============================================================================

# 1. Chuyển hướng HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name supportflastdev.io.vn www.supportflastdev.io.vn;

    # Xác thực Let's Encrypt Certbot ACME Webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ HTTPS (Port 443) an toàn với SSL/TLS 1.2 & 1.3
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supportflastdev.io.vn www.supportflastdev.io.vn;

    # Đường dẫn chứng chỉ SSL Let's Encrypt / Certbot
    ssl_certificate /etc/letsencrypt/live/supportflastdev.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supportflastdev.io.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Bảo mật Headers chuẩn quân sự (Rule 3.4 & 3.5 Antigravity Workspace)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
    add_header X-XSS-Protection "1; mode=block" always;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Tối ưu hóa Buffer & Tải lên file lớn 1000MB (1GB)
    client_max_body_size 1000M;
    client_body_buffer_size 16M;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 128k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 256k;

    # Gzip nén dữ liệu
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # WebSocket Proxy (/ws) - Real-time 2 chiều
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Giao thức WebDAV (/webdav/) - Kho file ảo VFS
    # Hỗ trợ Windows Map Network Drive, macOS Finder, WinSCP, Cyberduck
    location ^~ /webdav {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebDAV Headers thiết yếu (MOVE, COPY, PROPFIND, LOCK)
        proxy_set_header Destination $http_destination;
        proxy_set_header Depth $http_depth;
        proxy_set_header Overwrite $http_overwrite;
        proxy_set_header If $http_if;
        proxy_set_header Lock-Token $http_lock_token;
        proxy_set_header Timeout $http_timeout;

        client_max_body_size 1000M;
        client_body_buffer_size 16M;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    # Kho lưu trữ (/storage)
    location ^~ /storage {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 1000M;
        client_body_buffer_size 16M;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Static Assets Cache
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|svgz|webp|woff|woff2|ttf|gltf|bin)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Streaming Endpoints (Video/Audio)
    location ~ ^/api/(files|public/share)/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # API Endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Default SPA Proxy tới Go Gateway Engine (Port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
