name: SupportFlast CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify Engine
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: supportflast_engine/go.sum

    - name: Verify Go Engine
      working-directory: supportflast_engine
      run: |
        go mod verify
        go test -v ./security -run "TestSecurityHeadersMiddleware|TestVerifyTurnstileToken"
        go build -v -o supportflast_linux .

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Test AI Module
      working-directory: supportflast_ai
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python test_security_scanner.py
