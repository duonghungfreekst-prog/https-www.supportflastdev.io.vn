<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Nền vũ trụ đa tầng Deep Cosmic -->
    <radialGradient id="gemini-bg" cx="50%" cy="42%" r="58%" fx="50%" fy="38%">
      <stop offset="0%" stop-color="#0a1026" />
      <stop offset="65%" stop-color="#040714" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <!-- Viền phát quang Neon Cyan - Indigo - Tím -->
    <linearGradient id="gemini-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="48%" stop-color="#6366f1" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gradient đa sắc mượt mà cho Ngôi sao Gemini -->
    <linearGradient id="gemini-star-grad" x1="12%" y1="12%" x2="88%" y2="88%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="28%" stop-color="#22d3ee" />
      <stop offset="52%" stop-color="#6366f1" />
      <stop offset="78%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Lõi phát quang trung tâm (Supernova Luminescence Core) -->
    <radialGradient id="gemini-core-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="38%" stop-color="#67e8f9" stop-opacity="0.85" />
      <stop offset="62%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="82%" stop-color="#c084fc" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Quầng hào quang vũ trụ Nebula phía sau ngôi sao -->
    <radialGradient id="gemini-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Ánh sáng viền 3D phản chiếu bề mặt pha lê -->
    <linearGradient id="gemini-star-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Tia sáng quang học ngang (Horizontal Lens Flare) -->
    <linearGradient id="gemini-flare-h" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Tia sáng quang học dọc (Vertical Lens Flare) -->
    <linearGradient id="gemini-flare-v" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Nền hình tròn vũ trụ sâu thẳm -->
  <circle cx="50" cy="50" r="47.5" fill="url(#gemini-bg)" />

  <!-- 2. Vành đai tròn phát quang Neon Rim -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="url(#gemini-rim)" stroke-width="1.4" opacity="0.85" />

  <!-- 3. Vùng hào quang Nebula tỏa sáng phía sau sao -->
  <circle cx="50" cy="50" r="38" fill="url(#gemini-ambient-glow)" />

  <!-- 4. Điểm sao vệ tinh nhỏ góc trên bên phải (Đặc trưng Gemini AI) -->
  <path d="M 74 19 Q 74 24 79 24 Q 74 24 74 29 Q 74 24 69 24 Q 74 24 74 19 Z" fill="#00e5ff" opacity="0.9" />
  <circle cx="74" cy="24" r="1.2" fill="#ffffff" opacity="0.95" />

  <!-- 5. Điểm sao vệ tinh nhỏ góc dưới bên trái -->
  <path d="M 26 72 Q 26 75.5 29.5 75.5 Q 26 75.5 26 79 Q 26 75.5 22.5 75.5 Q 26 75.5 26 72 Z" fill="#c084fc" opacity="0.75" />
  <circle cx="26" cy="75.5" r="0.9" fill="#ffffff" opacity="0.85" />

  <!-- 6. Ngôi sao Gemini 4 cánh phát sáng đa sắc chính -->
  <path d="M 50 12 C 50 33 67 50 88 50 C 67 50 50 67 50 88 C 50 67 33 50 12 50 C 33 50 50 33 50 12 Z"
        fill="url(#gemini-star-grad)" />

  <!-- 7. Đường viền phản chiếu ánh kim 3D trên bề mặt cánh sao -->
  <path d="M 50 12 C 50 33 67 50 88 50 C 67 50 50 67 50 88 C 50 67 33 50 12 50 C 33 50 50 33 50 12 Z"
        fill="none" stroke="url(#gemini-star-sheen)" stroke-width="0.8" opacity="0.75" />

  <!-- 8. Cặp tia lóe sáng quang học chữ thập ở lõi sao -->
  <path d="M 18 50 Q 50 48.2 82 50 Q 50 51.8 18 50 Z" fill="url(#gemini-flare-h)" opacity="0.75" />
  <path d="M 50 18 Q 48.2 50 50 82 Q 51.8 50 50 18 Z" fill="url(#gemini-flare-v)" opacity="0.75" />

  <!-- 9. Quầng sáng phát quang siêu sao trung tâm -->
  <circle cx="50" cy="50" r="16" fill="url(#gemini-core-glow)" />

  <!-- 10. Điểm sáng trắng tinh khiết tâm AI (White-Hot Nucleus) -->
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" opacity="0.95" />
  <circle cx="50" cy="50" r="1.8" fill="#ffffff" />
</svg>
