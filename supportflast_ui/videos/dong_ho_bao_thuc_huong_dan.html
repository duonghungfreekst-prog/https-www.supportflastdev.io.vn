<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Hướng Dẫn: Đồng Hồ Báo Thức v1.0.1 (Flutter Pro Android)</title>
    <style>
        :root {
            --primary-orange: #ff6b00;
            --secondary-orange: #f97316;
            --light-orange: #fb923c;
            --accent-gold: #f59e0b;
            --bg-deep: #07080c;
            --bg-card: #11131c;
            --bg-card-hover: #171a27;
            --border-color: rgba(249, 115, 22, 0.3);
            --border-glow: rgba(249, 115, 22, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-neon: #10b981;
            --cyan-neon: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* 4K Header Bar */
        .header-bar {
            padding: 14px 28px;
            background: linear-gradient(180deg, rgba(17, 19, 28, 0.98) 0%, rgba(9, 10, 15, 0.95) 100%);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
            backdrop-filter: blur(12px);
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon-box {
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.25) 0%, rgba(249, 115, 22, 0.05) 100%);
            border: 1px solid var(--secondary-orange);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.35);
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-subtitle {
            font-size: 0.76rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .badge-4k {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.2), rgba(245, 158, 11, 0.2));
            color: var(--light-orange);
            border: 1px solid var(--border-glow);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(249, 115, 22, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 4K Stage / Cinema Container */
        .stage-viewport {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(ellipse at 50% 40%, #151825 0%, #07080c 100%);
            overflow: hidden;
        }

        .cinema-canvas {
            width: 100%;
            max-width: 1080px;
            background: rgba(17, 19, 28, 0.88);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(249, 115, 22, 0.12);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 480px;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
        }

        .scene-title-text {
            font-size: 1.45rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scene-desc-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.5;
        }

        .scene-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Realtime Clock Banner */
        .live-clock-card {
            background: rgba(9, 10, 15, 0.9);
            border: 1px solid rgba(249, 115, 22, 0.4);
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 16px;
        }

        .digital-digits {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--light-orange);
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
        }

        .digital-seconds {
            font-size: 1.6rem;
            color: #ffffff;
            opacity: 0.85;
        }

        /* Teleprompter Subtitles Box */
        .subtitles-box {
            background: rgba(8, 9, 14, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .subtitles-icon {
            font-size: 1.25rem;
            color: var(--secondary-orange);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .subtitles-text {
            font-size: 0.92rem;
            color: #e2e8f0;
            line-height: 1.5;
            font-style: italic;
            flex: 1;
        }

        /* 4K Controls Deck */
        .controls-deck {
            padding: 14px 28px;
            background: linear-gradient(0deg, rgba(17, 19, 28, 0.98) 0%, rgba(9, 10, 15, 0.95) 100%);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
            backdrop-filter: blur(12px);
        }

        .timeline-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .time-label {
            font-family: 'Consolas', monospace;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--light-orange);
            min-width: 95px;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: height 0.15s;
        }

        .progress-track:hover {
            height: 12px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-orange), var(--accent-gold));
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.8);
            border-radius: 4px;
            transition: width 0.25s linear;
        }

        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctl-btn {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .ctl-btn:hover {
            background: rgba(249, 115, 22, 0.2);
            border-color: var(--secondary-orange);
            color: var(--light-orange);
            transform: translateY(-1px);
        }

        .ctl-btn-primary {
            background: linear-gradient(135deg, var(--primary-orange), var(--secondary-orange));
            color: #000000;
            border: none;
            box-shadow: 0 0 14px rgba(249, 115, 22, 0.4);
        }

        .ctl-btn-primary:hover {
            background: linear-gradient(135deg, #ff7a1a, #fb923c);
            color: #000000;
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.6);
        }

        .scene-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: rgba(249, 115, 22, 0.2);
            border-color: var(--secondary-orange);
            color: var(--light-orange);
            font-weight: 700;
        }

        /* Component Visualizers */
        .pill-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(249, 115, 22, 0.12);
            color: var(--light-orange);
            border: 1px solid rgba(249, 115, 22, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .grid-cards-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .info-card {
            background: rgba(9, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s;
        }

        .info-card:hover {
            border-color: var(--border-glow);
            background: rgba(17, 19, 28, 0.9);
            transform: translateY(-2px);
        }

        /* Sound Wave Animation */
        .sound-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 24px;
        }

        .sound-bar {
            width: 4px;
            background: var(--secondary-orange);
            border-radius: 2px;
            animation: sound-bounce 1s infinite ease-in-out;
        }

        .sound-bar:nth-child(1) { height: 8px; animation-delay: 0.1s; }
        .sound-bar:nth-child(2) { height: 16px; animation-delay: 0.2s; }
        .sound-bar:nth-child(3) { height: 24px; animation-delay: 0.3s; }
        .sound-bar:nth-child(4) { height: 12px; animation-delay: 0.4s; }
        .sound-bar:nth-child(5) { height: 20px; animation-delay: 0.15s; }
        .sound-bar:nth-child(6) { height: 10px; animation-delay: 0.25s; }

        @keyframes sound-bounce {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1.0); }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.8)); }
        }

        /* Responsive 4K Mode */
        @media (min-width: 2560px) {
            .cinema-canvas {
                max-width: 1560px;
                min-height: 640px;
                padding: 48px;
            }
            .scene-title-text { font-size: 2.1rem; }
            .scene-desc-text { font-size: 1.2rem; }
            .digital-digits { font-size: 4rem; }
            .subtitles-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- 4K Header -->
    <header class="header-bar">
        <div class="brand-section">
            <div class="brand-icon-box">⏰</div>
            <div>
                <h1 class="brand-title">
                    ĐỒNG HỒ BÁO THỨC v1.0.1
                    <span style="color:var(--secondary-orange); font-size:0.8rem; border:1px solid var(--secondary-orange); padding:2px 6px; border-radius:4px;">PRO RELEASE</span>

        </div>
        <div style="display:flex; align-items:center; gap:12px;">

    <footer class="controls-deck">
        <div class="timeline-row">
            <span class="time-label" id="time-display">00:00 / 02:30</span>
            <div class="progress-track" onclick="handleSeek(event)">

        <div class="action-row">
            <div class="btn-group">
                <button class="ctl-btn ctl-btn-primary" id="play-btn" onclick="togglePlay()">⏸ Tạm Dừng</button>

                <button class="ctl-btn" onclick="prevScene()" title="Cảnh trước">⏮ Trước</button>

            <div class="scene-tabs" id="scene-tabs">

                voice: "Chào mừng quý vị và các bạn đến với video hướng dẫn trải nghiệm ứng dụng Đồng Hồ Báo Thức phiên bản 1.0.1. Được phát triển hoàn toàn trên nền tảng Flutter 3.x với giao diện Dark OLED cam neon sang trọng, ứng dụng giải quyết triệt để vấn đề báo thức bị trễ giờ hoặc tắt ngầm trên Android, đồng thời tích hợp giờ quốc tế, bấm giờ thể thao và đếm ngược chuyên nghiệp.",

            {

                voice: "Bước thứ tư và cũng là bước quan trọng nhất: Để đảm bảo ứng dụng reo chuông đúng giờ một trăm phần trăm kể cả khi tắt màn hình hay khóa máy, bạn hãy vào Cài đặt điện thoại, tìm mục Ứng dụng, cấp quyền Báo thức chính xác, chọn Pin không hạn chế và bật công tắc Tự khởi động. Như vậy bạn sẽ luôn an tâm thức giấc đúng hẹn mỗi ngày.",
                render: function() {
                    return `

                                <div style="display:flex; align-items:center; justify-content:space-between; background:#0e1017; border:1px solid rgba(16,185,129,0.3); padding:14px 20px; border-radius:12px;">
                                    <div style="display:flex; align-items:center; gap:12px;">
                                        <span style="font-size:1.4rem;">🚀</span>

                                            <div style="font-size:0.78rem; color:var(--text-muted);">Bảo toàn toàn bộ lịch hẹn giờ kể cả khi máy khởi động lại</div>
                                        </div>
                                    </div>
                                    <span style="color:#10b981; font-weight:800; font-size:0.9rem;">[CHO PHÉP TỰ CHẠY ✓]</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        ];

        let currentScene = 0;
        let isPlaying = true;
        let voiceEnabled = true;
        let playbackSpeed = 1.0;
        let elapsedSeconds = 0;
        const totalDuration = scenes.length * 30; // 30s mỗi cảnh = 2:30 tổng
        let mainTimer = null;
        let clockTimer = null;

        // Khởi tạo tab cảnh
        function initTabs() {
            const container = document.getElementById("scene-tabs");
            container.innerHTML = scenes.map((s, idx) => `
                <button class="tab-btn ${idx === 0 ? 'active' : ''}" onclick="jumpScene(${idx})" id="tab-btn-${idx}">
                    ${s.tab}
                </button>
            `).join("");
        }

        // Render cảnh
        function renderCurrentScene() {
            const sc = scenes[currentScene];
            const canvas = document.getElementById("canvas-container");
            canvas.innerHTML = `
                <div class="scene-header">
                    <div>
                        <div class="scene-title-text">${sc.title}</div>
                        <div class="scene-desc-text">${sc.desc}</div>
                    </div>
                    <span class="pill-tag" style="font-size:0.85rem; padding:6px 14px;">Cảnh ${currentScene + 1}/${scenes.length}</span>
                </div>

                <div class="scene-content-area">
                    ${sc.render()}
                </div>

                <div class="subtitles-box">
                    <span class="subtitles-icon">💬</span>
                    <span class="subtitles-text" id="subtitles-content">"${sc.voice}"</span>
                </div>
            `;

            // Cập nhật tab active
            document.querySelectorAll(".tab-btn").forEach((b, idx) => {
                b.classList.toggle("active", idx === currentScene);
            });

            // Kích hoạt thuyết minh Tiếng Việt
            speakVoice(sc.voice);
        }

        // Thuyết minh AI Tiếng Việt
        function speakVoice(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'vi-VN';
            utter.rate = playbackSpeed;

            // Tìm giọng Tiếng Việt tốt nhất
            const voices = window.speechSynthesis.getVoices();
            const viVoice = voices.find(v => v.lang.includes('vi') || v.lang.includes('VI'));
            if (viVoice) {
                utter.voice = viVoice;
            }

            window.speechSynthesis.speak(utter);
        }

        // Đồng hồ thời gian thực
        function updateLiveClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const el = document.getElementById("live-clock-display");
            if (el) {
                el.innerHTML = `${h}:${m}:<span class="digital-seconds">${s}</span>`;
            }
        }

        // Timer điều phối vòng đời video
        function tick() {
            if (!isPlaying) return;
            elapsedSeconds++;
            if (elapsedSeconds >= totalDuration) {
                elapsedSeconds = 0;
                currentScene = 0;
                renderCurrentScene();
            } else {
                const targetScene = Math.floor(elapsedSeconds / 30);
                if (targetScene !== currentScene && targetScene < scenes.length) {
                    currentScene = targetScene;
                    renderCurrentScene();
                }
            }
            updateProgressBar();
        }

        function updateProgressBar() {
            const pct = (elapsedSeconds / totalDuration) * 100;
            document.getElementById("progress-fill").style.width = pct + "%";
            
            const fmt = (sec) => {
                const m = String(Math.floor(sec / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');
                return `${m}:${s}`;
            };
            document.getElementById("time-display").innerText = `${fmt(elapsedSeconds)} / ${fmt(totalDuration)}`;
        }

        // Các hành động tương tác người dùng
        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById("play-btn").innerText = isPlaying ? "⏸ Tạm Dừng" : "▶ Tiếp Tục";
            if (!isPlaying && 'speechSynthesis' in window) {
                window.speechSynthesis.pause();
            } else if (isPlaying && 'speechSynthesis' in window) {
                window.speechSynthesis.resume();
            }
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            document.getElementById("voice-btn").innerText = voiceEnabled ? "🔊 Thuyết Minh AI: BẬT" : "🔈 Thuyết Minh AI: TẮT";
            if (!voiceEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            } else if (voiceEnabled) {
                speakVoice(scenes[currentScene].voice);
            }
        }

        function cycleSpeed() {
            const speeds = [1.0, 1.25, 1.5];
            const nextIdx = (speeds.indexOf(playbackSpeed) + 1) % speeds.length;
            playbackSpeed = speeds[nextIdx];
            document.getElementById("speed-btn").innerText = `⚡ ${playbackSpeed.toFixed(1)}x`;
            if (voiceEnabled) {
                speakVoice(scenes[currentScene].voice);
            }
        }

        function skipTime(delta) {
            elapsedSeconds = Math.max(0, Math.min(totalDuration - 1, elapsedSeconds + delta));
            currentScene = Math.floor(elapsedSeconds / 30);
            renderCurrentScene();
            updateProgressBar();
        }

        function jumpScene(idx) {
            currentScene = idx;
            elapsedSeconds = idx * 30;
            renderCurrentScene();
            updateProgressBar();
        }

        function nextSceneManual() {
            currentScene = (currentScene + 1) % scenes.length;
            elapsedSeconds = currentScene * 30;
            renderCurrentScene();
            updateProgressBar();
        }

        function prevScene() {
            currentScene = (currentScene - 1 + scenes.length) % scenes.length;
            elapsedSeconds = currentScene * 30;
            renderCurrentScene();
            updateProgressBar();
        }

        function handleSeek(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            elapsedSeconds = Math.floor(pos * totalDuration);
            currentScene = Math.min(Math.floor(elapsedSeconds / 30), scenes.length - 1);
            renderCurrentScene();
            updateProgressBar();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Không thể mở toàn màn hình: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Bắt phím tắt
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                togglePlay();
            } else if (e.code === "ArrowRight") {
                skipTime(10);
            } else if (e.code === "ArrowLeft") {
                skipTime(-10);
            } else if (e.code === "KeyF") {
                toggleFullscreen();
            } else if (e.code === "KeyM") {
                toggleVoice();
            }
        });

        // Tải danh sách giọng nói khi trình duyệt sẵn sàng
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                // Sẵn sàng giọng nói
            };
        }

        // Khởi động
        initTabs();
        renderCurrentScene();
        mainTimer = setInterval(tick, 1000);
        clockTimer = setInterval(updateLiveClock, 1000);
    </script>
