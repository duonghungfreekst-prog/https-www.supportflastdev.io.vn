                        ${sc.title}
                    </div>
                    <div style="color:#94a3b8; font-size:0.72rem; margin-top:2px;">
                        ${sc.desc.substring(0, 65)}...
                    </div>
                </div>
            `).join('');
        }

        function renderScene() {
            const sc = scenes[currentIdx];
            document.getElementById('scene-container').innerHTML = sc.render();
            document.getElementById('progress-fill').style.width = ((currentIdx + 1) / scenes.length * 100) + '%';
            document.getElementById('time-display').innerText = `Chương ${currentIdx + 1}/${scenes.length}`;
            renderChaptersSidebar();

            if (voiceEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(sc.voice);
                utter.lang = 'vi-VN';
                utter.rate = 1.05;
                window.speechSynthesis.speak(utter);
            }
        }

        function selectScene(idx) {
            currentIdx = idx;
            renderScene();
        }

        function nextScene() {
            currentIdx = (currentIdx + 1) % scenes.length;
            renderScene();
        }

        function prevScene() {
            currentIdx = (currentIdx - 1 + scenes.length) % scenes.length;
            renderScene();
        }

        function startAutoPlay() {
            if (sceneTimer) clearInterval(sceneTimer);
            sceneTimer = setInterval(() => {
                if (isPlaying) nextScene();
            }, 8500);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('play-btn').innerText = isPlaying ? '⏸ Tạm Dừng' : '▶ Tiếp Tục';
            if (!isPlaying && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            if (!voiceEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('voice-btn').innerText = voiceEnabled ? '🔊 Thuyết Minh AI: BẬT' : '🔇 Thuyết Minh: TẮT';
        }

        function seek(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            currentIdx = Math.floor(pct * scenes.length);
            if (currentIdx >= scenes.length) currentIdx = scenes.length - 1;
            renderScene();
        }

        // Khởi động
        renderScene();
        startAutoPlay();
    </script>
</body>
</html>
